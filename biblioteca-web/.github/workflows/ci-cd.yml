name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes do backend
        working-directory: backend
        run: mvn -B test

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Testes do frontend
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests
      - name: Build do frontend
        working-directory: frontend
        run: npm run build

  # (extra) build das imagens + teste de aceitação
  deploy:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Subir containers
        run: docker compose up -d --build
      - name: Aguardar backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/autores && break || sleep 3
          done
      - name: Teste de aceitação (autor + livro vinculado)
        run: |
          curl -sf -X POST http://localhost:8080/api/autores -H "Content-Type: application/json" \
            -d '{"nome":"Machado de Assis","nacionalidade":"Brasileira"}'
          curl -sf -X POST http://localhost:8080/api/livros -H "Content-Type: application/json" \
            -d '{"titulo":"Dom Casmurro","autor":{"id":1}}'
          curl -sf http://localhost:8080/api/livros
      - name: Derrubar containers
        if: always()
        run: docker compose down -v
